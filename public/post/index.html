<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>POST - Cadastrar</title>
    <link rel="stylesheet" href="../style.css">
</head>
<body>
    <nav>
  <a href="/post/index.html">Cadastrar (POST)</a>
  <a href="/get/index.html">Buscar (GET)</a>
  <a href="/put/index.html">Atualizar (PUT)</a>
  <a href="/delete/index.html">Deletar (DELETE)</a>
    </nav>
    
    <div class="container">
        <h2>Cadastrar Registro</h2>
        <form id="postForm">
            <input type="text" id="cpf" placeholder="CPF (Apenas números)" required>
            <input type="text" id="nome" placeholder="Nome" required>
            <input type="text" id="sobrenome" placeholder="Sobrenome" required>
            <input type="email" id="email" placeholder="E-mail" required>
            <input type="number" id="idade" placeholder="Idade" required>
            <input type="text" id="telefone" placeholder="Telefone">
            <input type="text" id="rg" placeholder="RG">
            <input type="text" id="rua" placeholder="Rua">
            <input type="text" id="bairro" placeholder="Bairro">
            <input type="text" id="cidade" placeholder="Cidade">
            <input type="text" id="estado" placeholder="Estado (Sigla)">
            <button type="submit">Cadastrar</button>
        </form>
    </div>
    <script src="script.js"></script>
</body>
</html>
